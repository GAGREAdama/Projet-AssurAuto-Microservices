
# ==========================================
# ASSURAUTO - API GATEWAY
# ==========================================

server.port=9999

# ==========================================
# ROUTE CLIENT
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=client-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://client-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/client-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# ==========================================
# ROUTE CONTRAT
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=contrat-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://contrat-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/contrat-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# ==========================================
# ROUTE VEHICULE
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=vehicule-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://vehicule-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/vehicule-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ==========================================
# ROUTE SINISTRE
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=sinistre-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://sinistre-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/sinistre-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# ==========================================
# FILTRE GLOBAL
# ==========================================

spring.cloud.gateway.server.webflux.default-filters[0]=AddResponseHeader=X-Gateway,AssurAuto-Proxy

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=always

# ==========================================
# SWAGGER UI CENTRALISE
# ==========================================

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.urls[0].name=Client Service
springdoc.swagger-ui.urls[0].url=/client-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Contrat Service
springdoc.swagger-ui.urls[1].url=/contrat-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Vehicule Service
springdoc.swagger-ui.urls[2].url=/vehicule-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Sinistre Service
springdoc.swagger-ui.urls[3].url=/sinistre-service/v3/api-docs
