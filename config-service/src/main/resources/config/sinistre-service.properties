server.port=8084

# --- Base de données dédiée (profil par défaut : H2 fichier, zéro installation) ---
spring.datasource.url=jdbc:h2:file:./data/sinistre_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Message de test rafraîchissable (POST /actuator/refresh) ---
assurauto.message=sinistre-service@AssurAuto
# --- Sécurité (utilisateurs en mémoire, HTTP Basic) ---
assurauto.security.admin-password=admin123
assurauto.security.agent-password=agent123
# Compte technique utilisé pour les appels entre microservices
assurauto.internal.username=agent
assurauto.internal.password=agent123
