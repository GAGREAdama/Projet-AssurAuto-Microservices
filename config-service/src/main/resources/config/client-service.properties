
server.port=8081

# --- Base de données MySQL dédiée au microservice Client ---
spring.datasource.url=jdbc:mysql://localhost:3307/client_db
spring.datasource.username=assurauto
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Message de test rafraîchissable ---
assurauto.message=client-service@AssurAuto

# --- Sécurité HTTP Basic ---
assurauto.security.admin-password=admin123
assurauto.security.agent-password=agent123

# --- Communication entre microservices ---
assurauto.internal.username=agent
assurauto.internal.password=agent123
