# --- Port du microservice Véhicule ---
server.port=8083

# --- Base de données MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3308/vehicule_db
spring.datasource.username=assurauto
spring.datasource.password=123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Configuration JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Message de test rafraîchissable ---
assurauto.message=vehicule-service@AssurAuto

# --- Sécurité HTTP Basic ---
assurauto.security.admin-password=admin123
assurauto.security.agent-password=agent123

# --- Authentification entre microservices ---
assurauto.internal.username=agent
assurauto.internal.password=agent123